<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FSTD Logbook — Registre des séances simulateur</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Registre des séances simulateur</h1>
    <p class="subtitle">FSTD Logbook</p>
  </header>

  <main>
    <section class="card form-card">
      <h2 id="form-title">Nouvelle séance</h2>
      <form id="session-form">
        <input type="hidden" id="session-id" />

        <div class="form-grid">
          <label>
            Date de la séance
            <input type="date" id="date" required />
          </label>

          <label>
            Créneau
            <select id="creneau" required>
              <option value="" disabled selected>Choisir…</option>
              <option value="Matin">Matin</option>
              <option value="Après-midi">Après-midi</option>
              <option value="Soir">Soir</option>
              <option value="Nuit">Nuit</option>
            </select>
          </label>

          <label>
            Heure de début
            <input type="time" id="heureDebut" required />
          </label>

          <label>
            Heure de fin
            <input type="time" id="heureFin" required />
          </label>

          <label>
            Nom du TRI
            <input type="text" id="nomTri" placeholder="Nom de l'instructeur" required />
          </label>

          <label>
            Nom du CDB
            <input type="text" id="nomCdb" placeholder="Nom du commandant de bord" required />
          </label>

          <label>
            Nom du FO
            <input type="text" id="nomFo" placeholder="Nom de l'officier pilote" required />
          </label>

          <label>
            Type de training
            <select id="typeTraining" required>
              <option value="" disabled selected>Choisir…</option>
              <option value="QT">QT</option>
              <option value="REC">REC (récurrent)</option>
            </select>
          </label>

          <label>
            Type de séance
            <select id="typeSeance" required>
              <option value="" disabled selected>Choisir…</option>
              <option value="FFS">FFS (Full Flight Simulator)</option>
              <option value="FBS">FBS (Fixed Base Simulator)</option>
            </select>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" id="submit-btn">Enregistrer la séance</button>
          <button type="button" id="cancel-edit" class="secondary" hidden>Annuler</button>
        </div>
        <p id="form-error" class="error" role="alert"></p>
      </form>
    </section>

    <section class="card table-card">
      <div class="table-header">
        <h2>Séances enregistrées</h2>
        <input type="search" id="search" placeholder="Rechercher (nom, date, type…)" />
      </div>
      <div class="table-scroll">
        <table id="sessions-table">
          <thead>
            <tr>
              <th>Date</th>
              <th>Créneau</th>
              <th>Début</th>
              <th>Fin</th>
              <th>TRI</th>
              <th>CDB</th>
              <th>FO</th>
              <th>Training</th>
              <th>Séance</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sessions-body">
            <tr><td colspan="10" class="empty">Chargement…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
